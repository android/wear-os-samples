name: WatchFaceFormat

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'WatchFaceFormat/**'
      - '.github/workflows/WatchFaceFormat.yml'
  pull_request:
    paths:
      - 'WatchFaceFormat/**'
      - '.github/workflows/WatchFaceFormat.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        sample:
          - Complications
          - Flavors
          - PhotosMask
          - PhotosMulti
          - SimpleAnalog
          - SimpleDigital
          - Weather

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 21
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: 'temurin'
          java-version: 25
          cache: gradle

      - name: Build project
        working-directory: WatchFaceFormat/${{ matrix.sample }}
        run: ./gradlew check --stacktrace
