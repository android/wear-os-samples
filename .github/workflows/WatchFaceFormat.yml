name: WatchFaceFormat

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'WatchFaceFormat/**'
      - '.github/workflows/WatchFaceFormat.yml'
  pull_request:
    paths:
      - 'WatchFaceFormat/**'
      - '.github/workflows/WatchFaceFormat.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        sample:
          - Complications
          - Flavors
          - PhotosMask
          - PhotosMulti
          - SimpleAnalog
          - SimpleDigital
          - Weather

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: 'temurin'
          java-version: 21
          cache: gradle

      - name: Build project
        working-directory: WatchFaceFormat/${{ matrix.sample }}
        run: ./gradlew check --stacktrace
