name: WearWidget

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'WearWidget/**'
      - '.github/workflows/WearWidget.yml'
  pull_request:
    paths:
      - 'WearWidget/**'
      - '.github/workflows/WearWidget.yml'

env:
  SAMPLE_PATH: WearWidget

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21
          cache: gradle

      - name: Build and Verify Screenshots
        working-directory: ${{ env.SAMPLE_PATH }}
        run: ./gradlew verifyRoborazziDebug --stacktrace
