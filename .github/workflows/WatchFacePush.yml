name: WatchFacePush

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'WatchFacePush/**'
      - '.github/workflows/WatchFacePush.yml'
  pull_request:
    paths:
      - 'WatchFacePush/**'
      - '.github/workflows/WatchFacePush.yml'

env:
  SAMPLE_PATH: WatchFacePush

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: 'temurin'
          java-version: 25
          cache: gradle

      - name: Build project
        working-directory: ${{ env.SAMPLE_PATH }}
        run: ./gradlew check --stacktrace
